<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="l6w9UYqKNciM2y-OGnUxU4Vyp-wyyRR3J_XUK4b41dw" />
    <meta name="description" content="Browse mathematics, physics, and chemistry books, including NCERT textbooks and study resources for JEE and Olympiad preparation.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="https://havs84188.github.io/AVS_BOOKS_REPOSITORY/">
    <title>AVS Books Repository</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AVS Books Repository</h1>
    </header>

    <div class="container">
        <h2>Library Collections</h2>
        <div class="subject-grid">
            <a href="maths.html" class="subject-card">Mathematics</a>
            <a href="physics.html" class="subject-card">Physics</a>
            <a href="chemistry.html" class="subject-card">Chemistry</a>
        </div>

        <div class="review-section">
            <h2>Feedback & Requests</h2>
            
            <form id="feedbackForm" action="https://formspree.io/f/mrpzvgkg" method="POST">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" rows="4" placeholder="What problems did you face? What books should we add?" required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Submit to AVS Agencies</button>
            </form>
        </div>
    </div>

    <footer>
        <p>Site developed by AVS Agencies | Owner: Mr. Atharva Veer Singh</p>
    </footer>

    <script src="feedback.js"></script>
</body>
</html>
